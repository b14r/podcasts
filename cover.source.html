<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:3000px;height:3000px;overflow:hidden;background:#000}
.t{position:absolute;left:0;right:0;text-align:center;font-family:'UnifrakturMaguntia',serif;line-height:1;color:#fff}
.t1{top:1010px;font-size:340px}
.t2{top:1360px;font-size:520px}
.rule{position:absolute;left:50%;transform:translateX(-50%);width:1300px;height:5px;background:#fff}
.r1{top:900px}.r2{top:2000px}
.cross{position:absolute;left:50%;top:600px;transform:translateX(-50%)}
.sub{position:absolute;left:0;right:0;top:2120px;text-align:center;font-family:'Cinzel',serif;font-weight:600;font-size:70px;letter-spacing:30px;color:#fff;opacity:.85}
</style></head><body>
<svg class="cross" width="2000" height="240" viewBox="-1000 -120 2000 240" fill="#fff">
  <defs>
    <!-- Templar: cross pattée -->
    <g id="pattee"><g id="pa"><path d="M-10 0L-46-98H46L10 0z"/></g><use href="#pa" transform="rotate(90)"/><use href="#pa" transform="rotate(180)"/><use href="#pa" transform="rotate(270)"/></g>
    <!-- Maltese -->
    <g id="malta"><g id="ma"><path d="M0 0L-50-100L0-74L50-100z"/></g><use href="#ma" transform="rotate(90)"/><use href="#ma" transform="rotate(180)"/><use href="#ma" transform="rotate(270)"/></g>
    <!-- Jerusalem -->
    <g id="jeru">
      <rect x="-13" y="-92" width="26" height="184"/><rect x="-92" y="-13" width="184" height="26"/>
      <rect x="-46" y="-104" width="92" height="24"/><rect x="-46" y="80" width="92" height="24"/>
      <rect x="-104" y="-46" width="24" height="92"/><rect x="80" y="-46" width="24" height="92"/>
      <g id="jc"><rect x="-6" y="-24" width="12" height="48"/><rect x="-24" y="-6" width="48" height="12"/></g>
      <use href="#jc" transform="translate(-56,-56)"/><use href="#jc" transform="translate(56,-56)"/><use href="#jc" transform="translate(-56,56)"/><use href="#jc" transform="translate(56,56)"/>
    </g>
    <!-- Latin -->
    <g id="latin"><rect x="-14" y="-100" width="28" height="200"/><rect x="-70" y="-50" width="140" height="28"/></g>
    <!-- Lorraine / patriarchal -->
    <g id="lorr"><rect x="-13" y="-100" width="26" height="200"/><rect x="-46" y="-68" width="92" height="24"/><rect x="-74" y="-16" width="148" height="24"/></g>
  </defs>
  <use href="#pattee" transform="translate(-720,0) scale(.85)"/>
  <use href="#malta"  transform="translate(-360,0) scale(.85)"/>
  <use href="#jeru"   transform="translate(0,0) scale(.9)"/>
  <use href="#latin"  transform="translate(360,0) scale(.85)"/>
  <use href="#lorr"   transform="translate(720,0) scale(.85)"/>
</svg>
<div class="rule r1"></div>
<div class="t t1">Battles of</div>
<div class="t t2">Christendom</div>
<div class="rule r2"></div>
<div class="sub">SIEGES · CRUSADES · MARTYRS</div>
</body></html>
